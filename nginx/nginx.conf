events {}

stream {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name gdcheerios.com www.gdcheerios.com;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name gdcheerios.com www.gdcheerios.com;

        ssl_certificate     /etc/letsencrypt/live/gdcheerios.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gdcheerios.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://gdcheerioscom:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /ws/ {
	    proxy_pass http://gdcheeriosws:8765/; 
    	    proxy_http_version 1.1;
     	    proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
	    proxy_set_header Host $host;
	}

	location /status/ {
	    proxy_set_header Host $http_host;
            proxy_pass http://status:3000;
	    proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;	
        }

	location /static/ {
    	    alias /static/;
	}
    }
}

