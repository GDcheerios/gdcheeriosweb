events {}

stream {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name gdcheerios.com www.gdcheerios.com;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name gdcheerios.com www.gdcheerios.com;

        ssl_certificate     /etc/letsencrypt/live/gdcheerios.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gdcheerios.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

	resolver 127.0.0.11 valid=30s;

        location / {
	    set $backend_app "http://gdcheerioscom:8000";
            proxy_pass $backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /ws/ {
	    set $backend_ws "http://gdcheeriosws:8765/";
	    proxy_pass $backend_ws; 
    	    proxy_http_version 1.1;
     	    proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
	    proxy_set_header Host $host;
	}

        location = /storage {
            return 301 /storage/;
        }

        location /storage/ {
            client_max_body_size 256m;
            set $backend_storage "http://gdcheeriosstorage:8000";
            rewrite ^/storage/(.*)$ /$1 break;
            proxy_pass $backend_storage;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

	location /status {
            return 301 /grafana/d/gd8pdt4/status?orgId=1&kiosk=tv;
        }
	location /grafana/ {
	    proxy_pass http://status:3000;
	    proxy_set_header Host $http_host;
	}

	location /alloy/ {
	    proxy_pass http://alloy:12345/;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
    	    proxy_redirect off;
	}

	location /static/ {
    	    alias /static/;
	}
    }
}

