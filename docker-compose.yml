services:
  gdcheerioscom:
    env_file: .env
    container_name: gdcheerioscom
    image: gdcheerios/gdcheerioscom:${TAG:-latest}
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://status:4318
      - OTEL_SERVICE_NAME=gdcheerioscom
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
    expose:
      - "8000"
    networks:
      - backend
    volumes:
      - static_volume:/app/static
    depends_on:
      - nginx
      - psql

  gdcheeriosws:
    env_file: .env
    container_name: gdcheeriosws
    image: gdcheerios/gdcheeriosws:${TAG:-latest}
    restart: always
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://status:4318
      - OTEL_SERVICE_NAME=gdcheeriosws
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
    expose:
      - "8765"
      - "8000"
    networks:
      - backend
    depends_on:
      - nginx
      - psql

  psql:
    image: postgres:18-alpine
    container_name: psql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql
    networks:
      - backend

  status:
    container_name: status
    image: grafana/otel-lgtm
    restart: always
    depends_on:
      - nginx
      - alloy
    environment:
      - GF_SERVER_ROOT_URL=${DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_DASHBOARDS_ALLOW_UI_UPDATES=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_HIDE_VERSION=true
    volumes:
      - ./grafana_data:/data
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    networks:
      - backend

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    privileged: true
    user: root
    restart: always
    depends_on:
      - nginx
    environment:
      - ALLOY_COLLECT_HOST=${ALLOY_COLLECT_HOST:-false}
      - ALLOY_MOUNT_PROPAGATION=${ALLOY_MOUNT_PROPAGATION:-rprivate}
      - ALLOY_ROOTFS_PATH=${ALLOY_ROOTFS_PATH:-/}
      - ALLOY_PROCFS_PATH=${ALLOY_PROCFS_PATH:-/proc}
      - ALLOY_SYSFS_PATH=${ALLOY_SYSFS_PATH:-/sys}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /:/host/root:ro
    networks:
      - backend

  nginx:
    container_name: nginx
    build: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "25565:25565"
    volumes:
      - ./nginx/${NGINX_CONFIG:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - static_volume:/static:ro
    networks:
      - backend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew;
        sleep 12h & wait $${!};
      done;"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  static_volume:
  postgres_data:
  lgtm-data:
